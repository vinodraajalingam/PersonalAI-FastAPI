on:
  push:
    branches:
      - main
jobs:
  deploy_fastapi:
    runs-on: ubuntu-latest
    steps:
      - name: First time
        run: echo "Job Started"
      - name: Git Checkout
        run: git clone https://github.com/vinodraajalingam/PersonalAI-FastAPI.git
      - name: Clone Status
        run: echo "Git Clone Completed"
      - name: Update Apt
        run: sudo apt update
      - name: Install Python
        run: sudo apt install python3 -y
      - name: Install Pip
        run: sudo apt install python3-pip -y
      - name: Python, Pip Status
        run: echo "Python,Pip Installed"
      - name: Change Directory
        run: cd PersonalAI-FastAPI
      - name: list files
        run: ls -lrt
      - name: Change Directory
        run: cd PersonalAI-FastAPI
      - name: list files
        run: ls -lrt
      - name: Install Dependency
        run: pip3 install -r requirement.txt
      - name: Dependency Status
        run: "Dependency Installed"
